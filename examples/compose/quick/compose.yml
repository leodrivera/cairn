# Cairn on a home network, over plain HTTP on port 8080.
# For anything reachable from the internet, use the Traefik example: it adds HTTPS and a CAPTCHA.
# Before the first start: mkdir files && sudo chown 10001:10001 files
services:
  cairn:
    image: ghcr.io/OWNER/cairn:0.1
    container_name: cairn
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./files:/srv
      - cairn-data:/data

volumes:
  cairn-data:
