# Cairn behind Traefik, with password sign-in plus "Sign in with Google" through OpenID Connect, and reCAPTCHA v2 on
# the password form. Cairn talks to the provider itself: no broker, no forward-auth.
# At the provider, register the redirect URI https://files.example.com/auth/oidc/google/callback.
# files.example.com must point at this machine, with ports 80 and 443 open to the internet.
# Before the first start:
#   mkdir files secrets && sudo chown 10001:10001 files
#   printf '%s' 'your-recaptcha-secret-key' > secrets/captcha_secret
#   printf '%s' 'your-oidc-client-secret' > secrets/oidc_client_secret
#   sudo chown 10001:10001 secrets/captcha_secret secrets/oidc_client_secret && sudo chmod 400 secrets/captcha_secret secrets/oidc_client_secret
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --certificatesresolvers.le.acme.email=admin@example.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  cairn:
    image: ghcr.io/leodrivera/cairn:0.1
    container_name: cairn
    restart: unless-stopped
    volumes:
      - ./files:/srv
      - cairn-data:/data
    environment:
      CAIRN_PUBLIC_URL: https://files.example.com
      CAIRN_TRUSTED_PROXIES: 172.31.0.0/24
      CAIRN_AUTH_METHODS: password,oidc
      # One provider with the id "google"; each id X reads CAIRN_OIDC_X_*. The issuer must be https.
      CAIRN_OIDC_PROVIDERS: google
      CAIRN_OIDC_GOOGLE_ISSUER: https://accounts.google.com
      CAIRN_OIDC_GOOGLE_CLIENT_ID: 1234567890-abc.apps.googleusercontent.com
      CAIRN_OIDC_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      CAIRN_OIDC_GOOGLE_NAME: Google
      CAIRN_CAPTCHA: recaptcha
      CAIRN_CAPTCHA_SITE_KEY: 6Lc-your-site-key
      CAIRN_CAPTCHA_SECRET_FILE: /run/secrets/captcha_secret
    secrets:
      - oidc_client_secret
      - captcha_secret
    labels:
      traefik.enable: "true"
      traefik.http.routers.cairn.rule: Host(`files.example.com`)
      traefik.http.routers.cairn.entrypoints: websecure
      traefik.http.services.cairn.loadbalancer.server.port: "8080"

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  cairn-data:
  letsencrypt:

secrets:
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  captcha_secret:
    file: ./secrets/captcha_secret
