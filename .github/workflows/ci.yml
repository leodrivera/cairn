name: CI

on:
  # Once per change: main, pull requests (Dependabot's included) and by hand. A tag push runs nothing here: the
  # release calls this workflow itself. No path filters, so check-readme sees every README and docs edit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release runs the same checks before it builds anything. It checks the images it pushes itself, so it
  # passes image: false.
  workflow_call:
    inputs:
      image:
        type: boolean
        default: true

permissions:
  contents: read

# A newer push cancels a superseded run, except on main, where every commit keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test the front-end
        working-directory: web
        run: npm ci --ignore-scripts && npm run check && npm test && npm run build
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Licenses
        run: scripts/check-licenses.sh
      - name: The README quotes the examples as they are
        run: tests/compose/check-readme.sh

  image:
    # Named by architecture, not by runner image: the ruleset on main requires image (amd64) and image (arm64),
    # so a runner bump does not rename a required check.
    name: image (${{ matrix.arch }})
    needs: test
    # Skipped only when a caller passes image: false. On push and pull_request the input is null, and
    # `null != false` is false (both coerce to 0), so compare the JSON text instead.
    if: ${{ toJSON(inputs.image) != 'false' }}
    timeout-minutes: 20
    # arm64 is built and checked only here, on a native runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-26.04 }
          - { arch: arm64, os: ubuntu-26.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the front-end for the size check
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - name: Build the image
        run: docker build -t cairn:ci .
      - name: Check the budget
        run: scripts/check-budget.sh cairn:ci
      - name: Check what the image promises
        run: scripts/check-image.sh cairn:ci
