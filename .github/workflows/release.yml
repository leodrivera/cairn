name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release at a time, so two tags cannot race for latest.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tests, lints, license check and image checks of ci.yml, on the tagged commit.
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      minor: ${{ steps.check.outputs.minor }}
      latest: ${{ steps.check.outputs.latest }}
      minor_latest: ${{ steps.check.outputs.minor_latest }}
      repo: ${{ steps.check.outputs.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every release tag, to tell whether this one is the highest.
          fetch-depth: 0
          fetch-tags: true
      - name: The tag matches Cargo.toml
        id: check
        run: |
          scripts/release-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cairn" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, version]
    # Each platform builds natively: aarch64 on an arm64 runner, never under emulation.
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, check and push by digest
        env:
          REPO: ${{ needs.version.outputs.repo }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          digest=$(scripts/release-image.sh push "$REPO" "$PLATFORM" | tail -1)
          mkdir -p digests && echo "$digest" > "digests/${PLATFORM//\//-}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: One manifest for both platforms
        env:
          REPO: ${{ needs.version.outputs.repo }}
          VERSION: ${{ needs.version.outputs.version }}
          MINOR: ${{ needs.version.outputs.minor }}
          LATEST: ${{ needs.version.outputs.latest }}
          MINOR_LATEST: ${{ needs.version.outputs.minor_latest }}
        run: |
          mapfile -t digests < <(cat digests/*)
          scripts/release-image.sh merge "$REPO" "$VERSION" "$MINOR" "$LATEST" "$MINOR_LATEST" "${digests[@]}"
          docker buildx imagetools inspect "$REPO:$VERSION" | tee inspect.txt
          grep -q 'linux/amd64' inspect.txt && grep -q 'linux/arm64' inspect.txt
