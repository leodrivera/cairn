# The image under test; Traefik on loopback ports with the test certificate, answering inside the network for the
# hosts; Keycloak loading the test realm and standing in for Google; CAPTCHA off so a password sign-in can run offline.
services:
  traefik:
    command: !override
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --providers.file.filename=/certs/tls.yml
    ports: !override
      - 127.0.0.1:18081:80
      - 127.0.0.1:18443:443
    volumes:
      - ${CAIRN_TEST_CA:?}:/certs:ro
    networks:
      default:
        aliases: [files.example.com, auth.example.com, id.example.com]
  keycloak:
    command: !override [start, --import-realm]
    volumes:
      - ${CAIRN_TEST_REALM:?}:/opt/keycloak/data/import/realm.json:ro
  cairn:
    image: ${CAIRN_TEST_IMAGE:?}
    environment:
      CAIRN_OIDC_GOOGLE_ISSUER: https://id.example.com/realms/cairn
      CAIRN_OIDC_GOOGLE_CLIENT_ID: cairn
      CAIRN_CAPTCHA: none
