[package]
name = "cairn"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Self-hosted web file browser. Your files. One small binary."
publish = false

[dependencies]
axum = "0.8.9"
ipnet = "2.12.2"
lexopt = "0.3.2"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "signal", "macros"] }
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "fmt"] }
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
