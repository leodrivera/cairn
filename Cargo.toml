[package]
name = "cairn"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Self-hosted web file browser. Your files. One small binary."
publish = false

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-graceful", "http1", "service"] }
ipnet = "2.12.2"
lexopt = "0.3.2"
ring = "0.17.14"
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "signal", "macros", "io-util", "time", "sync", "fs"] }
tower-http = { version = "0.7.1", features = ["set-header"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "fmt"] }
url = "2.5.8"
ureq = { version = "3.5.0", features = ["json"] }
rustix = { version = "1.1.6", features = ["fs"] }
tokio-util = { version = "0.7.20", features = ["io"] }
httpdate = "1.0.3"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
zip = { version = "9.1.3", default-features = false }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"

# Argon2id is slow without optimization; tests hash many passwords.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
